name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Google Maven Aynasi Ekle
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              buildscript {
                  repositories {
                      maven { url 'https://googleapis.com' }
                      google()
                  }
              }
              repositories {
                  maven { url 'https://googleapis.com' }
                  google()
              }
          }
          EOF

      - name: Gradle Kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: APK Olustur
        run: gradle assembleDebug --no-daemon

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: StokCevap-APK
          path: app/build/outputs/apk/debug/app-debug.apk
